[project]
name = "deep-seek-fix"
version = "0.1.0"
description = "Deterministic reliability control plane for inexpensive coding models and agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "bandit>=1.8.6",
  "fastapi>=0.116.1",
  "httpx>=0.28.1",
  "opentelemetry-api>=1.36.0",
  "pydantic>=2.11.7",
  "pyyaml>=6.0.2",
  "sqlalchemy>=2.0.41",
  "typer>=0.16.0",
  "uvicorn>=0.35.0",
]

[project.scripts]
dsfix = "deep_seek_fix.cli.app:app"

[dependency-groups]
dev = [
  "hypothesis>=6.136.6",
  "mypy>=1.17.0",
  "pip-audit>=2.9.0",
  "pytest>=8.4.1",
  "pytest-cov>=6.2.1",
  "ruff>=0.12.5",
  "types-PyYAML>=6.0.12.20250915",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_seek_fix"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S105", "S603", "S607"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=deep_seek_fix --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
branch = true
source = ["deep_seek_fix"]
