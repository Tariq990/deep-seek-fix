services:
  langfuse-placeholder:
    image: langfuse/langfuse:3
    profiles: ["langfuse"]
    environment:
      DATABASE_URL: "postgresql://langfuse:langfuse@postgres:5432/langfuse"
      NEXTAUTH_SECRET: "replace-with-local-secret"
      SALT: "replace-with-local-salt"
    depends_on:
      - postgres

  postgres:
    image: postgres:17
    profiles: ["langfuse"]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-postgres:/var/lib/postgresql/data

volumes:
  langfuse-postgres:

